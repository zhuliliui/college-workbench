<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#a7c4ab" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

<body>
  <div class="app">
    <!-- 左侧/底部 固定导航 -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo"><img src="assets/icons/hk-07.png"?v=232 alt=""/></div>
        <div class="brand-text">
          <h1>万能工作台</h1>
          <span>AI Study Hub</span>
        </div>
      </div>
      <nav class="nav" id="nav"><!-- 由 JS 渲染 --></nav>
      <div class="sidebar-foot">
        <div class="piggy-mini" id="sidebarPiggy">
          <img class="e piggy-mini-icon" src="assets/icons/hk-02.png"?v=232 alt="存钱罐"/>
          <span class="t">虚拟存钱罐</span>
          <span class="v" id="sidebarPiggyValue">¥0.00</span>
        </div>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" aria-label="菜单"><img src="assets/icons/hk-42.png"?v=232 alt="" style="width:20px;height:20px;object-fit:contain;vertical-align:middle"/></button>
        <div class="topbar-title" id="pageTitle">万能工作台</div>
        <div class="topbar-actions">
          <button class="btn btn-soft" id="calBtn" title="提醒设置（微信推送 + 日历订阅）"><img src="assets/icons/hk-41.png"?v=232 alt="" style="width:16px;height:16px;object-fit:contain;vertical-align:middle;margin-right:4px"/>提醒</button>
          <button class="btn btn-soft" id="exportBtn" title="云端同步 / 本地备份"><img src="assets/icons/hk-33.png"?v=232 alt="" style="width:16px;height:16px;object-fit:contain;vertical-align:middle;margin-right:4px"/>备份</button>
        </div>
      </header>
      <section class="content" id="content"><!-- 各页面在此渲染 --></section>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script src="js/store.js"?v=232></script>
